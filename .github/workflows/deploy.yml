name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Rebuild recommendations (fails the deploy if the pipeline breaks)
        run: |
          MODE=rubric
          if [ -f data/engine_a_ratings.json ]; then MODE=claude; fi
          cd pipeline && python build_recs.py --engine-a $MODE
      - name: Rebuild demo page from the new recommendations
        run: node scripts/build_demo.mjs
      - run: npm ci
      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute rec-engine --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
