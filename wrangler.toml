name = "rec-engine"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/demo", "/demo.html"]

[vars]
# Set to "true" only on a staging deploy: lets ?preview=1 show the true source.
ALLOW_PREVIEW = "false"
FRAME_ANCESTORS = "https://*.qualtrics.com"

[[d1_databases]]
binding = "DB"
database_name = "rec-engine"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[env.staging]
name = "rec-engine-staging"
[env.staging.vars]
ALLOW_PREVIEW = "true"
FRAME_ANCESTORS = "https://*.qualtrics.com"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "rec-engine"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
